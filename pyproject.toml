[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldvolume"
version = "0.1.0"
description = "Klein-Gordon solver on D-brane worldvolumes with mixed Neumann / Dirichlet / Robin boundary conditions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WorldVolume team" }]
keywords = ["string theory", "D-branes", "eigenvalue problem", "finite difference"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["worldvolume*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
